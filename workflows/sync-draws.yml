name: Sync Daily Lottery Draws

on:
  schedule:
    # 每日北京时间 21:45、22:15、23:00 自动抓取最新开奖记录
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      source_url:
        description: '开奖抓取地址 (默认 https://2026kj.zkclhb.com:2025/am.html)'
        required: false
        default: 'https://2026kj.zkclhb.com:2025/am.html'

permissions:
  contents: write

jobs:
  sync-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and merge latest draws
        run: |
          URL="${{ github.event.inputs.source_url }}"
          if [ -z "$URL" ]; then
            URL="https://2026kj.zkclhb.com:2025/am.html"
          fi
          node scripts/sync_latest.mjs --url "$URL"

      - name: Run unit & database integrity tests
        run: npm test

      - name: Commit and push updated draw database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/draws.js
          if git diff --staged --quiet; then
            echo "No new draw updates detected."
          else
            LATEST_ID=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/draws.json','utf8'));console.log(d.latestId||'latest');")
            git commit -m "chore(data): sync lottery draws up to ${LATEST_ID}"
            git push
          fi
