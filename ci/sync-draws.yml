# 每日自动抓取开奖 → 写回 data/draws.json + data/draws.js → 提交
#
# ⚠ 位置很关键：GitHub 只会读取 `.github/workflows/` 下的文件。
#   这个文件以前放在仓库根目录的 `workflows/` 里，所以从来没有被执行过，
#   底库因此一直停在 2026-298（页面上的「一键同步」只是读这份静态文件）。
#
# 为什么要放在服务端跑：上游是 https://2026kj.zkclhb.com:2025/am.html
#   - 非标准端口 2025，证书链不完整
#   - 浏览器里还会被 CORS 拦掉
#   Node 脚本用 rejectUnauthorized:false 才能抓到，浏览器永远做不到。

name: Sync Daily Lottery Draws

on:
  schedule:
    # 每日北京时间 21:45 / 22:15 / 23:00 各抓一次（开奖后分批兜底）
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      source_url:
        description: '开奖抓取地址（留空用默认源）'
        required: false
        default: ''
      dry_run:
        description: '只抓取不写入（调试用，填 1 生效）'
        required: false
        default: ''

permissions:
  contents: write

# 避免定时任务与手动触发同时写同一个分支
concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能 git pull --rebase
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and merge latest draws
        id: sync
        # 抓取失败不直接中断：先把结论写进 summary，再让最后一步统一报错
        continue-on-error: true
        run: |
          URL="${{ github.event.inputs.source_url }}"
          if [ -z "$URL" ]; then
            URL="https://2026kj.zkclhb.com:2025/am.html"
          fi
          echo "抓取源: $URL"
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            node scripts/sync_latest.mjs --url "$URL" --dry-run
          else
            node scripts/sync_latest.mjs --url "$URL"
          fi

      - name: Run unit & database integrity tests
        run: npm test

      - name: Commit and push updated draw database
        id: commit
        run: |
          git add data/draws.json data/draws.js
          if git diff --staged --quiet; then
            echo "No new draw updates detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_ID=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/draws.json','utf8'));console.log(d.latestId||'latest');")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): sync lottery draws up to ${LATEST_ID}"
          # 定时任务期间可能有人合并了 PR，先 rebase 再推，避免 non-fast-forward
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed ${LATEST_ID}"

      - name: 底库新鲜度检查
        id: stale
        run: |
          node -e "
          const fs = require('fs');
          const db = JSON.parse(fs.readFileSync('data/draws.json', 'utf8'));
          const latest = db.latestDate || '';
          const today = new Date().toISOString().slice(0, 10);
          const days = latest ? Math.round((Date.parse(today) - Date.parse(latest)) / 86400000) : -1;
          console.log('底库最新: ' + (db.latestId || '—') + ' (' + (latest || '—') + ')，今天 ' + today + '，相差 ' + days + ' 天');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '| 项 | 值 |\n| --- | --- |\n' +
            '| 底库最新 | ' + (db.latestId || '—') + ' |\n' +
            '| 最新日期 | ' + (latest || '—') + ' |\n' +
            '| 今天 | ' + today + ' |\n' +
            '| 相差 | ' + days + ' 天 |\n' +
            '| 抓取结果 | ' + '${{ steps.sync.outcome }}' + ' |\n');
          if (days > 1) {
            console.log('::warning::底库落后 ' + days + ' 天，可能上游未更新或抓取失败');
            process.exitCode = 0;
          }
          "

      - name: 抓取失败时明确报错
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::抓取上游开奖失败。可能原因：上游站点不可达 / 证书或端口变更 / 页面结构变动导致解析不出记录。"
          echo "请查看上一步日志，或手动运行 node scripts/sync_latest.mjs --input <已保存的页面> 兜底。"
          exit 1
