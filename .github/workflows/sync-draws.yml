# 每日自动抓取开奖 → 写回 data/draws.json + data/draws.js → 提交
#
# ⚠ 位置很关键：GitHub 只会读取 `.github/workflows/` 下的文件。
#   这个文件以前放在仓库根目录的 `workflows/` 里，所以从来没有被执行过。
#
# ⚠ 关于「为什么改了 ci/ 还要手动装一次」：
#   本仓库的自动提交令牌没有 `workflows` 权限，任何对 .github/workflows/*.yml 的
#   自动推送都会被 GitHub 拒绝。所以这里改了以后需要你自己跑一次：
#       npm run install:workflow
#       git add .github/workflows/sync-draws.yml && git commit -m "ci: faster draw sync" && git push
#
#   不过——**即使不装，同步也不会再拖到第二天**：
#   scripts/sync_latest.mjs 自己会「门控 → 反复重抓直到拿到今天这期 → 先提交再跑测试」，
#   旧版 workflow 的三次触发（21:45 / 22:15 / 23:00）已经够用。装上这份只是更快更省。

name: Sync Daily Lottery Draws

on:
  schedule:
    # 全部为 UTC，减 8 小时 = 北京时间
    #  - 20:35 预探一次（有时上游提前放榜）
    #  - 21:00–23:55 每 5 分钟一次：开奖公布通常比停售晚 5~30 分钟，
    #    再加上 GitHub schedule 本身会延迟甚至漏触发，只有加密频率才稳
    #  - 次日 00:15 兜底（跨零点补一次）
    - cron: '35 12 * * *'
    - cron: '*/5 13-15 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      source_url:
        description: '开奖抓取地址（留空用默认源）'
        required: false
        default: ''
      dry_run:
        description: '只抓取不写入（调试用，填 1 生效）'
        required: false
        default: ''

permissions:
  contents: write

# 避免定时任务与手动触发同时写同一个分支
concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync-draws:
    runs-on: ubuntu-latest
    # 脚本在「上游还没发布」时会一直重试到 23:55 北京，这里留足时间
    timeout-minutes: 155
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能 git pull --rebase
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 36 次/天里绝大多数都是秒退：底库已经有今天这期就不抓、不测、不提交
      - name: 门控：今天这一期已经入库了吗
        id: gate
        run: |
          if node scripts/sync_latest.mjs --gate-only; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "底库已有今天这一期，跳过（秒退）"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and merge latest draws
        id: sync
        if: steps.gate.outputs.need == 'true'
        # 抓取失败不直接中断：先让最后一步统一报错，日志里也能看到原因
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: |
          ARGS=""
          URL="${{ github.event.inputs.source_url }}"
          if [ -n "$URL" ]; then
            ARGS="--url $URL"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "参数: $ARGS"
          # 脚本自己负责：反复重抓直到拿到今天这期 → 校验 → 写库 → 提交推送（带 rebase 重试）
          node scripts/sync_latest.mjs $ARGS

      # ⚠ 顺序很重要：数据已经由脚本提交推送，测试放在后面，
      #   这样任何「与数据无关」的断言飘红都不会把当天开奖卡在门外。
      - name: Run unit & database integrity tests
        if: steps.gate.outputs.need == 'true'
        continue-on-error: true
        run: npm test

      # 兜底提交：正常情况下脚本已经推过了，这里会因为「没有变化」直接跳过
      - name: Commit and push updated draw database
        if: steps.gate.outputs.need == 'true'
        id: commit
        run: |
          git add data/draws.json data/draws.js
          if git diff --staged --quiet; then
            echo "No new draw updates detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_ID=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/draws.json','utf8'));console.log(d.latestId||'latest');")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): sync lottery draws up to ${LATEST_ID}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Pushed ${LATEST_ID}"
              exit 0
            fi
            echo "push 第 ${i} 次失败，$((i * 5)) 秒后重试…"
            sleep $((i * 5))
          done
          echo "::error::底库提交推送三次都失败"
          exit 1

      - name: 底库新鲜度检查
        id: stale
        # 固定北京时间，避免 UTC 机器在北京 00:00–08:00 之间算出「早一天」
        env:
          TZ: Asia/Shanghai
        run: |
          node -e "
          const fs = require('fs');
          const db = JSON.parse(fs.readFileSync('data/draws.json', 'utf8'));
          const latest = db.latestDate || '';
          const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai' }).format(new Date());
          const days = latest ? Math.round((Date.parse(today) - Date.parse(latest)) / 86400000) : -1;
          console.log('底库最新: ' + (db.latestId || '—') + ' (' + (latest || '—') + ')，北京今天 ' + today + '，相差 ' + days + ' 天');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '| 项 | 值 |\n| --- | --- |\n' +
            '| 底库最新 | ' + (db.latestId || '—') + ' |\n' +
            '| 最新日期 | ' + (latest || '—') + ' |\n' +
            '| 北京今天 | ' + today + ' |\n' +
            '| 相差 | ' + days + ' 天 |\n' +
            '| 门控 | need=' + '${{ steps.gate.outputs.need }}' + ' |\n' +
            '| 抓取结果 | ' + '${{ steps.sync.outcome }}' + ' |\n');
          if (days > 1) {
            console.log('::warning::底库落后 ' + days + ' 天：可能是上游未发布，也可能是抓取失败，看上面的日志');
          }
          "

      - name: 抓取失败时明确报错
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::抓取上游开奖失败。可能原因：上游站点不可达 / 证书或端口变更 / 页面结构变动导致解析不出记录。"
          echo "请查看上一步日志，或手动运行 node scripts/sync_latest.mjs --input <已保存的页面> 兜底。"
          exit 1
