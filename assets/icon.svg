<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f6f8fb" />
      <stop offset="100%" stop-color="#eef2f7" />
    </linearGradient>
    <linearGradient id="redBall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ff5f6d" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="blueBall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenBall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#d4a72c" stroke-width="8" stroke-opacity="0.55" />

  <!-- Top Title Badge -->
  <rect x="96" y="54" width="320" height="56" rx="28" fill="#fdf5dd" stroke="#d4a72c" stroke-width="3" />
  <text x="256" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#a97d13" text-anchor="middle">7码复式 · 三中三</text>

  <!-- 3 Lottery Balls -->
  <circle cx="136" cy="236" r="68" fill="url(#redBall)" />
  <circle cx="136" cy="236" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" />
  <text x="136" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">07</text>

  <circle cx="256" cy="236" r="68" fill="url(#blueBall)" />
  <circle cx="256" cy="236" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" />
  <text x="256" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">23</text>

  <circle cx="376" cy="236" r="68" fill="url(#greenBall)" />
  <circle cx="376" cy="236" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3" />
  <text x="376" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">38</text>

  <!-- Bottom Banner -->
  <rect x="68" y="356" width="376" height="84" rx="22" fill="#ffffff" stroke="#dce4ee" stroke-width="3" />
  <text x="256" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#263548" text-anchor="middle">三中三 / 四中四 智选系统</text>
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle">C(7,3)=35注 · 2022-2026全底库</text>
</svg>
